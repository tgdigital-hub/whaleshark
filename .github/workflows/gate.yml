# The gate on hosted machines: the same program that runs on a developer's
# own machine. No step here is written by anyone else: the commit is fetched
# with plain git, and the machine's own Go fetches and checks the toolchain
# that go.mod names. So there is nothing of another project's to pin. Where
# a machine has no Go on its path it still has some in its own tool folder,
# put there by whoever built the machine; the newest of those starts us off.
name: gate

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: auto

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Fetch this commit
        run: |
          git init -q .
          git config core.autocrlf false
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA" || git fetch -q --depth 1 origin "$GITHUB_REF"
          git checkout -q FETCH_HEAD
      - name: A Go to start from
        run: command -v go || ls -d "$RUNNER_TOOL_CACHE"/go/*/*/bin | sort -V | tail -1 >> "$GITHUB_PATH"
      - name: The Go that go.mod names
        run: go version
      - name: The gate
        run: go run ./build/ci build vet fmt test cross lines modules page commands imports timing publish
      - name: The noisy shells three times more, by themselves (a bench, to be taken out)
        if: always() && runner.os == 'Linux'
        run: |
          uname -r; nproc; ls -l /bin/sh
          go test ./internal/keeper -run TestTwentyNoisyShellsLoseNoByte -count=3 -v -timeout 4m

  security:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch this commit and its history
        run: |
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch -q origin "$GITHUB_SHA" || git fetch -q origin "$GITHUB_REF"
          git checkout -q FETCH_HEAD
      - name: Install the checkers, each at an exact version (none is shipped)
        run: |
          # Each is built with the Go that go.mod names: a checker reads our
          # code with the Go it was built with, and an older one cannot.
          export GOTOOLCHAIN="$(go env GOVERSION)"
          # staticcheck's newest release pins a reading library from before
          # Go 1.27.2, which cannot read what that Go compiles. So it is
          # built in a module of its own with the library that can, both at
          # exact versions and both checked by Go as every module is.
          mkdir "$RUNNER_TEMP/staticcheck"
          (cd "$RUNNER_TEMP/staticcheck" && go mod init staticcheck &&
            go get honnef.co/go/tools/cmd/staticcheck@v0.8.1 golang.org/x/tools@v0.51.0 &&
            go install honnef.co/go/tools/cmd/staticcheck)
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: The outside checkers, and the publish check over the history
        run: go run ./build/ci security history
