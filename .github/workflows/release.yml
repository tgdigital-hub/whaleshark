# A release, on hosted machines. A tag v1.2.3 makes the real one, as a draft
# that a person publishes; anything else is a dry run, which signs with keys
# made in the run and thrown away with it, and publishes nothing. A dry run
# starts by hand, or by itself when what makes a release has changed.
#
# apt reads only an OpenPGP signature, so its index has a key of its own,
# the secret APT_KEY. Where that secret is not there, a tag's release is
# made without it: the index is not signed and the draft carries no apt
# folder. A dry run started by hand can be told to go that way too.
#
# No step here is written by anyone else (see gate.yml). No file passes from
# one job to the next: every job builds the files again from the commit,
# which gives the same bytes, and only the two signatures travel. So the job
# that holds the keys can write nothing, and the job that can write the
# draft holds no key. The keys are handed to one step, the last of their
# job, and the right to write to one step, the last of its job. A tag must
# name a commit of main: any other is refused before anything is built.
name: release

on:
  push:
    tags: ['v[0-9]*']
    branches: ['**']
    paths: ['build/release/**', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      apt-key:
        description: with a key for the apt index made in the run, or without one, as a tag is while that key does not exist
        type: choice
        options: [with, without]
        default: with

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0-dry' }}
  APT: ${{ inputs.apt-key || 'with' }}

jobs:
  sign:
    runs-on: ubuntu-24.04
    # The real keys are secrets of the environment "release", which a
    # person approves each time; a dry run has no environment and no secret.
    environment: ${{ github.ref_type == 'tag' && 'release' || '' }}
    outputs:
      signer: ${{ steps.sign.outputs.signer }}
      list: ${{ steps.sign.outputs.list }}
      sig: ${{ steps.sign.outputs.sig }}
      index: ${{ steps.sign.outputs.index }}
      key: ${{ steps.sign.outputs.key }}
    steps:
      - name: Fetch this commit
        run: |
          git init -q .
          git config core.autocrlf false
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA" || git fetch -q --depth 1 origin "$GITHUB_REF"
          git checkout -q FETCH_HEAD
      - name: A tag names a commit of main, or nothing is built and nothing signed
        id: tagmain
        run: |
          # A tag's run uses the workflow file of the commit the tag names:
          # a tag set by mistake on a commit of some other branch would
          # release that tree with that tree's pipeline. It is refused
          # here, before anything of the commit runs.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            git fetch -q origin main
            git merge-base --is-ancestor HEAD FETCH_HEAD || { echo "::error::The tag names a commit that is not in the history of main."; exit 1; }
          fi
      - name: The Go that go.mod names, and no other
        run: |
          command -v go || ls -d "$RUNNER_TOOL_CACHE"/go/*/*/bin | sort -V | tail -1 >> "$GITHUB_PATH"
          echo "GOTOOLCHAIN=go$(sed -n 's/^go //p' go.mod)" >> "$GITHUB_ENV"
      - name: A dry run's keys, made here and thrown away with the run
        run: |
          umask 077
          mkdir "$RUNNER_TEMP/gnupg"
          echo "GNUPGHOME=$RUNNER_TEMP/gnupg" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            export GNUPGHOME="$RUNNER_TEMP/gnupg"
            ssh-keygen -q -t ed25519 -N '' -C '' -f "$RUNNER_TEMP/key"
            [ "$APT" = without ] || gpg --batch --passphrase '' --quick-generate-key 'a dry run' ed25519 sign never
            echo "SIGNER=release namespaces=\"file\" $(cut -d' ' -f1,2 "$RUNNER_TEMP/key.pub")" >> "$GITHUB_ENV"
          fi
      - name: The files
        run: go run ./build/release -version "${TAG#v}" ${SIGNER:+-signer "$SIGNER"}
      - name: Sign the list of checksums and the apt index
        id: sign
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
          APT_KEY: ${{ secrets.APT_KEY }}
        run: |
          umask 077
          # A tag's keys are taken only here, after everything that was
          # fetched and built has run: nothing but the lines below runs
          # while they are on this machine.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            printf '%s\n' "$RELEASE_KEY" > "$RUNNER_TEMP/key"
            [ -z "$APT_KEY" ] || printf '%s\n' "$APT_KEY" | gpg --batch --import
          fi
          ssh-keygen -q -Y sign -f "$RUNNER_TEMP/key" -n file dist/SHA256SUMS
          # The signature must answer to the line install.sh carries, and
          # install.ps1 must carry the same line.
          sed -n "s/^SIGNER='\(.*\)'$/\1/p" dist/install.sh > "$RUNNER_TEMP/signers"
          sed -n "s/^[$]SIGNER = '\(.*\)'$/\1/p" dist/install.ps1 | cmp - "$RUNNER_TEMP/signers"
          ssh-keygen -Y verify -f "$RUNNER_TEMP/signers" -I release -n file -s dist/SHA256SUMS.sig < dist/SHA256SUMS
          {
            echo "signer=$(cat "$RUNNER_TEMP/signers")"
            echo "list=$(base64 -w0 dist/SHA256SUMS)"
            echo "sig=$(base64 -w0 dist/SHA256SUMS.sig)"
          } >> "$GITHUB_OUTPUT"
          if gpg --batch --list-secret-keys --with-colons | grep -q '^sec'; then
            gpg --batch --clearsign -o "$RUNNER_TEMP/InRelease" dist/apt/dists/stable/Release
            gpg --batch --armor --export > "$RUNNER_TEMP/apt.asc"
            # A tag's index is signed with the key whose public half the
            # repository carries, and with no other.
            fingerprint() { gpg --batch --show-keys --with-colons "$1" | awk -F: '$1 == "fpr" { print $10; exit }'; }
            if [ "$GITHUB_REF_TYPE" = tag ] && [ "$(fingerprint "$RUNNER_TEMP/apt.asc")" != "$(fingerprint dist/apt/whaleshark.asc)" ]; then
              echo "::error::The secret APT_KEY is not the key of build/release/whaleshark.asc."
              exit 1
            fi
            {
              echo "index=$(base64 -w0 "$RUNNER_TEMP/InRelease")"
              echo "key=$(base64 -w0 "$RUNNER_TEMP/apt.asc")"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::notice::There is no apt key: the apt index is not signed, and this release carries no apt folder."
          fi

  install:
    needs: sign
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      SIGNER: ${{ needs.sign.outputs.signer }}
      LIST: ${{ needs.sign.outputs.list }}
      SIG: ${{ needs.sign.outputs.sig }}
      INDEX: ${{ needs.sign.outputs.index }}
      KEY: ${{ needs.sign.outputs.key }}
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - name: Fetch this commit
        run: |
          git init -q .
          git config core.autocrlf false
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA" || git fetch -q --depth 1 origin "$GITHUB_REF"
          git checkout -q FETCH_HEAD
      - name: The Go that go.mod names, and no other
        run: |
          command -v go || ls -d "$RUNNER_TOOL_CACHE"/go/*/*/bin | sort -V | tail -1 >> "$GITHUB_PATH"
          echo "GOTOOLCHAIN=go$(sed -n 's/^go //p' go.mod)" >> "$GITHUB_ENV"
      - name: A second build gives the files that were signed
        run: |
          # Homebrew is given this folder for the release's address; winget
          # reads the real one, and takes no other kind.
          [ "$RUNNER_OS" != macOS ] || site=file://$PWD/site
          go run ./build/release -version "${TAG#v}" -signer "$SIGNER" ${site:+-site "$site"}
          echo "$LIST" | base64 -d | cmp - dist/SHA256SUMS
          echo "$SIG" | base64 -d > dist/SHA256SUMS.sig
          if [ -n "$INDEX" ]; then
            echo "$INDEX" | base64 -d > dist/apt/dists/stable/InRelease
            echo "$KEY" | base64 -d > dist/apt/whaleshark.asc
          fi
          mkdir site
          cp -R dist "site/$TAG"
      - name: install.sh installs it for one login, and it runs
        if: runner.os != 'Windows'
        run: |
          export HOME="$RUNNER_TEMP/home"
          mkdir "$HOME"
          export SHELL=/bin/sh
          sh dist/install.sh --from dist
          # Then piped to sh, as the one line runs it, over the first as an
          # upgrade is: a new terminal finds it, and no start file changes.
          cp "$HOME/.profile" "$RUNNER_TEMP/profile"
          cat dist/install.sh | sh -s -- --from dist
          cmp "$HOME/.profile" "$RUNNER_TEMP/profile"
          (. "$HOME/.profile" && whaleshark version) | grep -F "whaleshark ${TAG#v} "
          "$HOME/.local/bin/whaleshark" version | grep -F "whaleshark ${TAG#v} "
      - name: install.ps1 installs it for one login, in both PowerShells, and it runs
        if: runner.os == 'Windows'
        run: |
          # Windows PowerShell 5.1 first, then PowerShell 7 over it, as an
          # upgrade is.
          export LOCALAPPDATA=$(cygpath -w "$RUNNER_TEMP/local")
          powershell -NoProfile -ExecutionPolicy Bypass -File dist/install.ps1 -From dist
          pwsh -NoProfile -ExecutionPolicy Bypass -File dist/install.ps1 -From dist
          "$RUNNER_TEMP/local/Programs/whaleshark/whaleshark.exe" version | grep -F "whaleshark ${TAG#v} "
          if command -v winget >/dev/null; then
            winget validate --manifest dist/winget --disable-interactivity
          else
            echo "no winget on this machine: nothing read the three files"
          fi
      - name: apt installs it from the repository's files, and it runs
        if: runner.os == 'Linux'
        run: |
          if [ -n "$INDEX" ]; then
            sudo install -m 644 dist/apt/whaleshark.asc /etc/apt/keyrings/whaleshark.asc
            echo "deb [signed-by=/etc/apt/keyrings/whaleshark.asc] file://$PWD/dist/apt stable main" |
              sudo tee /etc/apt/sources.list.d/whaleshark.list
            sudo apt-get update -o Dir::Etc::sourcelist=sources.list.d/whaleshark.list -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
            sudo apt-get install -y whaleshark
          else
            # No apt key, so no index apt would believe: the package alone
            # is installed, by the tool under apt.
            echo "::notice::There is no apt key: the package is installed by dpkg, not from an index."
            sudo dpkg -i dist/apt/pool/whaleshark_*_amd64.deb
          fi
          dpkg -S /usr/bin/whaleshark
          /usr/bin/whaleshark version | grep -F "whaleshark ${TAG#v} "
      - name: Homebrew installs it from the formula, and it runs
        if: runner.os == 'macOS'
        run: |
          brew tap-new --no-git dry/whaleshark
          cp dist/brew/whaleshark.rb "$(brew --repository dry/whaleshark)/Formula/"
          brew install dry/whaleshark/whaleshark
          "$(brew --prefix)/bin/whaleshark" version | grep -F "whaleshark ${TAG#v} "
      - name: A file changed by one byte is refused
        run: |
          f=dist/$(cd dist && ls | grep "^whaleshark-$(go env GOOS)-$(go env GOARCH)")
          was=$(dd if="$f" bs=1 skip=4096 count=1 2>/dev/null | od -An -tu1)
          printf "\\$(printf '%03o' $(((was + 1) % 256)))" | dd of="$f" bs=1 seek=4096 conv=notrunc 2>/dev/null
          export HOME="$RUNNER_TEMP/second-home"
          mkdir "$HOME"
          if [ "$RUNNER_OS" = Windows ]; then
            LOCALAPPDATA=$(cygpath -w "$RUNNER_TEMP/second-local") powershell -NoProfile -ExecutionPolicy Bypass -File dist/install.ps1 -From dist ||
              [ -e "$RUNNER_TEMP/second-local/Programs/whaleshark/whaleshark.exe" ] || exit 0
          else
            sh dist/install.sh --from dist || [ -e "$HOME/.local/bin/whaleshark" ] || exit 0
          fi
          echo "the changed file was taken"
          exit 1

  # Only a tag comes here. The draft is public to nobody until a person
  # publishes it.
  draft:
    if: github.ref_type == 'tag'
    needs: [sign, install]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      SIGNER: ${{ needs.sign.outputs.signer }}
      LIST: ${{ needs.sign.outputs.list }}
      SIG: ${{ needs.sign.outputs.sig }}
      INDEX: ${{ needs.sign.outputs.index }}
      KEY: ${{ needs.sign.outputs.key }}
    steps:
      - name: Fetch this commit
        run: |
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA" || git fetch -q --depth 1 origin "$GITHUB_REF"
          git checkout -q FETCH_HEAD
      - name: The Go that go.mod names, and no other
        run: |
          command -v go || ls -d "$RUNNER_TOOL_CACHE"/go/*/*/bin | sort -V | tail -1 >> "$GITHUB_PATH"
          echo "GOTOOLCHAIN=go$(sed -n 's/^go //p' go.mod)" >> "$GITHUB_ENV"
      - name: A build once more gives the files that were signed
        run: |
          go run ./build/release -version "${TAG#v}" -signer "$SIGNER"
          echo "$LIST" | base64 -d | cmp - dist/SHA256SUMS
          echo "$SIG" | base64 -d > dist/SHA256SUMS.sig
          if [ -n "$INDEX" ]; then
            echo "$INDEX" | base64 -d > dist/apt/dists/stable/InRelease
            echo "$KEY" | base64 -d > dist/apt/whaleshark.asc
          fi
      - name: The draft, and its files fetched back and checked
        # The one step that is handed the right to write.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Without an apt key the draft carries no apt folder: an index
          # nobody signed is not handed out.
          folders="brew winget"
          if [ -n "$INDEX" ]; then
            folders="apt $folders"
          else
            echo "::notice::There is no apt key: the draft's packages.tar.gz holds no apt folder."
          fi
          tar -czf packages.tar.gz -C dist $folders
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes "" \
            dist/whaleshark-* dist/install.sh dist/install.ps1 dist/LICENSE dist/NOTICE dist/SHA256SUMS dist/SHA256SUMS.sig packages.tar.gz
          gh release download "$TAG" -D back -p 'whaleshark-*' -p install.sh -p install.ps1 -p LICENSE -p NOTICE -p 'SHA256SUMS*'
          (cd back && sha256sum -c SHA256SUMS)
          cmp back/SHA256SUMS dist/SHA256SUMS
          cmp back/SHA256SUMS.sig dist/SHA256SUMS.sig
